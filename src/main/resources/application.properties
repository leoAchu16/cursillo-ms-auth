spring.application.name=cursillo-ms-auth

server.port=8085

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.open-in-view=false
spring.liquibase.enabled=false


eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

logging.file.name=logs/auth.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.level.root=INFO
logging.level.org.cursillo.auth=DEBUG
logging.level.org.hibernate.SQL=DEBUG



security.jwt.secret=${JWT_SECRET}
security.jwt.algorithm=HS256
security.jwt.expiration-minutes=60
security.jwt.issuer=cursillo-ms-auth
security.jwt.claim.user=id
security.jwt.claim.roles=roles